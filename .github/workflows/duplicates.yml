name: "Duplicated code"
on: pull_request

jobs:
  duplicate-code-check:
    name: Check for duplicate code
    runs-on: ubuntu-20.04
    steps:
      - name: Check for duplicate code
        uses: platisd/duplicate-code-detection-tool@master
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          directories:
            "apps/account_service/src/,
            apps/api_gateway/src/,
            apps/integration_service/src/,
            apps/price_service/src/,
            jobs/assets/src/,
            jobs/lambda_external_prices/src/,
            jobs/lambda_prices/src/,
            jobs/lambda_prices_cleanup/src/,
            jobs/lambda_protocol_prices/src/,
            jobs/lambda_vaults/src/,
            jobs/migration_chain_crawler/src/,
            jobs/migration_events_consumer/src/,
            jobs/migration_token_consumer/src/,
            jobs/migration_transactions_consumer/src/,
            jobs/price_crawlers/src/"
          # Ignore the specified directories
          ignore_directories: "src/external_libraries"
          # Only examine .ts
          file_extensions: "ts"
          # Only report similarities above 5%
          ignore_below: 90
          # If a file is more than 70% similar to another, then the job fails
          fail_above: 95
          # If a file is more than 15% similar to another, show a warning symbol in the report
          warn_above: 90
          # Remove `src/` from the file paths when reporting similarities
          project_root_dir: "/"
