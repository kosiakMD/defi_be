version: "3.9"
services:

  redis:
    image: "bitnami/redis:latest"
    ports:
      - "6379:6379"
    environment:
      - ALLOW_EMPTY_PASSWORD=yes

  postgres:
    image: postgres
    ports:
      - "5432:5432"
    volumes:
    - ./.docker/pgsql:/var/lib/postgresql/data
    environment:
      - POSTGRES_USER=${DB_USERNAME}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=${DB_DATABASE}

  price-service:
    image: node:14
    ports:
      - "${PRICE_SERVICE_PORT:-3002}:${PRICE_SERVICE_PORT:-3002}"
    working_dir: /usr/src/app
    depends_on:
      - redis
      - postgres
    volumes:
      - .:/usr/src/app
    command: "yarn price-start:dev"
    restart: always
    environment:
      - SERVICE_PORT=${PRICE_SERVICE_PORT:-3002}
    env_file:
      - "apps/price_service/config/.env"
      - ".env"

  account-service:
    image: node:14
    ports:
      - "${ACCOUNT_SERVICE_PORT:-3003}:${ACCOUNT_SERVICE_PORT:-3003}"
    working_dir: /usr/src/app
    depends_on:
      - redis
      - postgres
      - price-service
    volumes:
      - .:/usr/src/app
    command: "yarn account-start:dev"
    restart: always
    environment:
      - SERVICE_PORT=${ACCOUNT_SERVICE_PORT:-3003}
    env_file:
      - "apps/account_service/config/.env"
      - ".env"

  integration-service:
    image: node:14
    ports:
      - "${INTEGRATION_SERVICE_PORT:-3004}:${INTEGRATION_SERVICE_PORT:-3004}"
    working_dir: /usr/src/app
    depends_on:
      - redis
      - postgres
      - price-service
      - account-service
    volumes:
      - .:/usr/src/app
    command: "yarn integration-start:dev"
    restart: always
    environment:
      - SERVICE_PORT=${INTEGRATION_SERVICE_PORT:-3004}
      - PRICE_SERVICE_URL=${PRICE_SERVICE_HOST}:${PRICE_SERVICE_PORT:-3002}
      - ACCOUNT_SERVICE_URL=${ACCOUNT_SERVICE_HOST}:${ACCOUNT_SERVICE_PORT:-3003}
    env_file:
      - "apps/integration_service/config/.env"
      - ".env"

  gateway-service:
    image: node:14
    ports:
      - "${GATEWAY_SERVICE_PORT:-3001}:${GATEWAY_SERVICE_PORT:-3001}"
    working_dir: /usr/src/app
    depends_on:
      - redis
      - postgres
      - price-service
      - integration-service
      - account-service
    volumes:
      - .:/usr/src/app
    command: "yarn gateway-start:dev"
    restart: always
    environment:
      - SERVICE_PORT=${GATEWAY_SERVICE_PORT:-3001}
    env_file:
      - "apps/api_gateway/config/.env"
      - ".env"

  rpc-nodes-service:
    image: node:14
    ports:
      - "${RPC_NODES_SERVICE_PORT:-3005}:${RPC_NODES_SERVICE_PORT:-3005}"
    working_dir: /usr/src/app
    depends_on:
      - redis
      - postgres
    volumes:
      - .:/usr/src/app
    command: "yarn rpc-nodes-start:dev"
    restart: always
    environment:
      - SERVICE_PORT=${RPC_NODES_SERVICE_PORT:-3005}
    env_file:
      - "apps/rpc_nodes_service/config/.env"
      - ".env"

  opportunities-service:
    image: node:14
    ports:
      - "${OPPORTUNITIES_SERVICE_PORT:-3006}:${OPPORTUNITIES_SERVICE_PORT:-3006}"
    working_dir: /usr/src/app
    depends_on:
      - redis
      - postgres
    volumes:
      - .:/usr/src/app
    command: "yarn opportunities-start:dev"
    restart: always
    environment:
      - SERVICE_PORT=${OPPORTUNITIES_SERVICE_PORT:-3006}
    env_file:
      - "apps/opportunities_service/config/.env"
      - ".env"
