# Danger js
# For more information see: https://danger.systems/js/
# https://github.com/marketplace/actions/danger-js-action

name: "Danger JS"
on: [pull_request]

jobs:
  build:
    name: Danger JS
    runs-on: ubuntu-latest

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v2

      - name: Set up Node.js
        uses: actions/setup-node@v1
        with:
          node-version: 14

      - name: "Install root dependencies"
        run: npm install

      - name: "Running danger ci"
        run: |
          DANGER_DISABLE_TRANSPILATION="true" DEBUG="*" npx danger ci
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
