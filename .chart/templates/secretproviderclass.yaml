apiVersion: secrets-store.csi.x-k8s.io/v1alpha1
kind: SecretProviderClass
metadata:
  name: {{ include "defiyield-service.fullname" . }}-secrets
  labels:
    {{- include "defiyield-service.labels" . | nindent 4 }}
spec:
  provider: aws
  parameters:
    objects: |
{{- range $name := .Values.secrets }}
      - objectName: "defiyield/{{ $.Values.application.environment }}/{{ $name }}"
        objectType: "secretsmanager"
        objectVersionLabel: "AWSCURRENT"
{{- end }}