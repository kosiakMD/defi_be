version: "3.9"

services:
  init-read-env:
    image: public.ecr.aws/u0p0n5o0/envread:latest
    environment:
      - ENV_READER_PRIORITY=local
    env_file:
      .env
    volumes:
      - ./apps:/apps

  redis:
    image: "bitnami/redis:latest"
    container_name: redis
    volumes:
      - ./docker/data/redis:/bitnami/redis/data
    ports:
      - "6379:6379"
    environment:
      - ALLOW_EMPTY_PASSWORD=yes

  postgres:
    image: postgres
    container_name: postgres
    ports:
      - "5432:5432"
    volumes:
    - ./docker/data/pgsql:/var/lib/postgresql/data
    environment:
      - POSTGRES_USER=${DB_USERNAME}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=${DB_DATABASE}

  price-service:
    image: node:14
    container_name: price-service
    ports:
      - "${PRICE_SERVICE_PORT:-3002}:${PRICE_SERVICE_PORT:-3002}"
    working_dir: /usr/src/app
    depends_on:
      init-read-env:
        condition: service_completed_successfully
      redis:
        condition: service_started
      postgres:
        condition: service_started
    volumes:
      - .:/usr/src/app
    command: "yarn price-start:dev"
    restart: always
    environment:
      - SERVICE_PORT=${PRICE_SERVICE_PORT:-3002}
    env_file:
      - "apps/price_service/config/.env"
      - ".env"

  account-service:
    image: node:14
    container_name: account-service
    ports:
      - "${ACCOUNT_SERVICE_PORT:-3003}:${ACCOUNT_SERVICE_PORT:-3003}"
    working_dir: /usr/src/app
    depends_on:
      init-read-env:
        condition: service_completed_successfully
      redis:
        condition: service_started
      postgres:
        condition: service_started
      price-service:
        condition: service_started
    volumes:
      - .:/usr/src/app
    command: "yarn account-start:dev"
    restart: always
    environment:
      - SERVICE_PORT=${ACCOUNT_SERVICE_PORT:-3003}
    env_file:
      - "apps/account_service/config/.env"
      - ".env"

  integration-service:
    build:
      context: .
      dockerfile: docker/integration-service.dev.Dockerfile
    container_name: integration-service
    ports:
      - "${INTEGRATION_SERVICE_PORT:-3004}:${INTEGRATION_SERVICE_PORT:-3004}"
    working_dir: /usr/src/app
    depends_on:
      init-read-env:
        condition: service_completed_successfully
      redis:
        condition: service_started
      postgres:
        condition: service_started
      price-service:
        condition: service_started
      account-service:
        condition: service_started
    volumes:
      - .:/usr/src/app
    command: "yarn integration-start:dev"
    restart: always
    environment:
      - SERVICE_PORT=${INTEGRATION_SERVICE_PORT:-3004}
      - PRICE_SERVICE_URL=${PRICE_SERVICE_HOST}:${PRICE_SERVICE_PORT:-3002}
      - ACCOUNT_SERVICE_URL=${ACCOUNT_SERVICE_HOST}:${ACCOUNT_SERVICE_PORT:-3003}
    env_file:
      - "apps/integration_service/config/.env"
      - ".env"

  gateway-service:
    image: node:14
    container_name: gateway-service
    ports:
      - "${GATEWAY_SERVICE_PORT:-3001}:${GATEWAY_SERVICE_PORT:-3001}"
    working_dir: /usr/src/app
    depends_on:
      init-read-env:
        condition: service_completed_successfully
      redis:
        condition: service_started
      postgres:
        condition: service_started
      price-service:
        condition: service_started
      integration-service:
        condition: service_started
      account-service:
        condition: service_started
    volumes:
      - .:/usr/src/app
    command: "yarn gateway-start:dev"
    restart: always
    environment:
      - SERVICE_PORT=${GATEWAY_SERVICE_PORT:-3001}
    env_file:
      - "apps/api_gateway/config/.env"
      - ".env"

  # rpc-nodes-service:
  #   image: node:14
  #   container_name: rpc-nodes-service
  #   ports:
  #     - "${RPC_NODES_SERVICE_PORT:-3005}:${RPC_NODES_SERVICE_PORT:-3005}"
  #   working_dir: /usr/src/app
  #   depends_on:
  #     init-read-env:
  #       condition: service_completed_successfully
  #     redis:
  #       condition: service_started
  #     postgres:
  #       condition: service_started
  #   volumes:
  #     - .:/usr/src/app
  #   command: "yarn rpc-nodes-start:dev"
  #   restart: always
  #   environment:
  #     - SERVICE_PORT=${RPC_NODES_SERVICE_PORT:-3005}
  #   env_file:
  #     - "apps/rpc_nodes_service/config/.env"
  #     - ".env"

  assets-service:
    image: node:14
    container_name: assets-service
    ports:
      - "${ASSETS_SERVICE_PORT:-6066}:${ASSETS_SERVICE_PORT:-6066}"
    working_dir: /usr/src/app
    depends_on:
      init-read-env:
        condition: service_completed_successfully
      redis:
        condition: service_started
      postgres:
        condition: service_started
    volumes:
      - .:/usr/src/app
    command: "yarn assets-start:dev"
    restart: always
    environment:
      - SERVICE_PORT=${ASSETS_SERVICE_PORT:-3005}
    env_file:
      - ".env"
      - "apps/assets_service/config/.env"

  opportunities-service:
    image: node:14
    container_name: opportunities-service
    ports:
      - "${OPPORTUNITIES_SERVICE_PORT:-3006}:${OPPORTUNITIES_SERVICE_PORT:-3006}"
    working_dir: /usr/src/app
    depends_on:
      init-read-env:
        condition: service_completed_successfully
      redis:
        condition: service_started
      postgres:
        condition: service_started
    volumes:
      - .:/usr/src/app
    command: "yarn opportunities-start:dev"
    restart: always
    environment:
      - SERVICE_PORT=${OPPORTUNITIES_SERVICE_PORT:-3006}
      - INTEGRATION_SERVICE_URL=${INTEGRATION_SERVICE_HOST}:${INTEGRATION_SERVICE_PORT:-3004}
    env_file:
      - "apps/opportunities_service/config/.env"
      - ".env"
