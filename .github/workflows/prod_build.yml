# Danger js
# For more information see: https://danger.systems/js/
# https://github.com/marketplace/actions/danger-js-action

name: 'Prod Build'
on: [pull_request]

jobs:
  build:
    name: 'Run Prod Build'
    runs-on: ubuntu-latest

    steps:
      - name: 'Use checkout@v2'
        uses: actions/checkout@v2

      - name: 'Set up Node.js'
        uses: actions/setup-node@v1
        with:
          node-version: '14'
          architecture: 'x64'
          check-latest: true
          cache: 'yarn'

      - name: 'Use yarn'
        uses: borales/actions-yarn@v2.0.0

      - name: 'Install Nest CLI'
        run: yarn global add @nestjs/cli

      - name: 'Install dependencies'
        run: yarn install

      - name: 'Build project'
        run: build-monorepo
