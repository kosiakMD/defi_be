ingress:
  enabled: true
  host: account.staging.defyield.xyz

configMaps:
  common:
    INTEGRATION_SERVICE_URL: http://integration-service
  config:
    HTTP_TIMEOUT: 60000
    HTTP_MAX_REDIRECTS: 2
  logs:
    LOG_AWS_ENABLED: true
    LOG_LEVEL: debug
    NODE_ENV: development
    AWS_XRAY_DAEMON_ADDRESS: xray-service.default:2000

secrets:
  - database
  - redis
  - logs
  - sentry
  - multifarm

initContainer:
  enabled: true
  name: ctmigration
  image: ""
  spec:
    command: [ "node", "./node_modules/typeorm/cli.js", "migration:run", "-f", "dist/apps/opportunities_service/src/ormconfig.js" ]
